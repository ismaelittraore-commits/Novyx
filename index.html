<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeTranslate Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; }
        
        /* En-tête */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
        header h1 { font-size: 20px; color: #38bdf8; font-weight: bold; }

        /* Contenu principal */
        .container { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        .lang-selector { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 15px; border-radius: 10px; border: 1px solid #334155; }
        .lang-selector select { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 8px; border-radius: 6px; font-size: 14px; }

        .card-box { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
        .card-box label { font-size: 13px; color: #94a3b8; font-weight: bold; }
        .card-box textarea { width: 100%; background: #0f172a; color: #fff; border: 1px solid #475569; padding: 12px; border-radius: 8px; resize: none; height: 100px; font-size: 15px; }

        .translate-btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .translate-btn:active { background: #0ea5e9; }

        .result-box { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; min-height: 80px; }
        .result-text { color: #38bdf8; font-size: 16px; margin-top: 5px; word-break: break-word; }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <h1>GlobeTranslate</h1>
        <span style="font-size: 13px; color: #94a3b8;">En direct</span>
    </header>

    <!-- Corps de l'application -->
    <div class="container">
        
        <!-- Sélecteur de langues -->
        <div class="lang-selector">
            <div>
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 3px;">De :</label>
                <select id="source-lang">
                    <option value="fr">Français</option>
                    <option value="en">Anglais</option>
                    <option value="es">Espagnol</option>
                    <option value="de">Allemand</option>
                </select>
            </div>
            <span style="font-size: 20px; color: #94a3b8; margin-top: 15px;">➡️</span>
            <div>
                <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 3px;">Vers :</label>
                <select id="target-lang">
                    <option value="en">Anglais</option>
                    <option value="fr">Français</option>
                    <option value="es">Espagnol</option>
                    <option value="de">Allemand</option>
                </select>
            </div>
        </div>

        <!-- Saisie du texte -->
        <div class="card-box">
            <label>Texte à traduire</label>
            <textarea id="input-text" placeholder="Écris ton texte ici..."></textarea>
        </div>

        <!-- Bouton d'action -->
        <button class="translate-btn" onclick="traduirePourDeVrai()">Traduire maintenant</button>

        <!-- Résultat -->
        <div class="result-box">
            <label style="font-size: 13px; color: #94a3b8; font-weight: bold;">Traduction</label>
            <div id="output-text" class="result-text">Le résultat apparaîtra ici...</div>
        </div>

    </div>

    <script>
        async function traduirePourDeVrai() {
            const texte = document.getElementById('input-text').value.trim();
            const src = document.getElementById('source-lang').value;
            const dest = document.getElementById('target-lang').value;
            const sortie = document.getElementById('output-text');

            if (texte === "") {
                sortie.innerText = "⚠️ Veuillez d'abord écrire un texte à traduire.";
                return;
            }

            sortie.innerText = "⏳ Traduction en cours...";

            try {
                // Utilisation d'une API de traduction publique et gratuite
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(texte)}&langpair=${src}|${dest}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.responseData) {
                    sortie.innerText = data.responseData.translatedText;
                } else {
                    sortie.innerText = "❌ Erreur lors de la traduction.";
                }
            } catch (error) {
                sortie.innerText = "❌ Impossible de se connecter au service de traduction.";
            }
        }
    </script>
</body>
</html>
