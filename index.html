```html
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novyx - Streaming HD Gratuit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#E50914',
                            dark: '#141414',
                            card: '#1F1F1F',
                            muted: '#808080'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ADSTERRA POPUNDER SCRIPT (Placé dans le head pour tourner en arrière-plan) -->
    <script type="text/javascript" src="//aarems.org/1/27b5e6f34adc19ac857c7d1955a4d11a"></script>
</head>
<body class="bg-brand-dark text-white font-sans antialiased min-h-screen flex flex-col selection:bg-brand-red selection:text-white">

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-50 bg-brand-dark/95 backdrop-blur border-b border-white/10 px-4 lg:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <h1 class="text-3xl font-black tracking-wider text-brand-red cursor-pointer" onclick="showTab('home')">NOVYX</h1>
            <div class="hidden md:flex gap-6 text-sm font-semibold">
                <button onclick="showTab('home')" class="hover:text-brand-red transition">Accueil</button>
                <button onclick="showTab('history')" class="hover:text-brand-red transition flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left"></i> Historique
                </button>
                <button onclick="showTab('favorites')" class="hover:text-brand-red transition flex items-center gap-2">
                    <i class="fa-solid fa-heart"></i> Favoris
                </button>
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="relative w-48 sm:w-72">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Rechercher un film, série..." 
                class="w-full bg-black/50 border border-white/20 rounded-full py-1.5 px-4 pl-10 text-sm focus:outline-none focus:border-brand-red transition">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-brand-muted text-sm"></i>
        </div>
    </nav>

    <!-- MOBILE TABS BAR -->
    <div class="flex md:hidden justify-around bg-brand-card/80 backdrop-blur border-b border-white/10 p-3 text-sm font-medium">
        <button onclick="showTab('home')" class="hover:text-brand-red flex items-center gap-1">
            <i class="fa-solid fa-house"></i> Accueil
        </button>
        <button onclick="showTab('history')" class="hover:text-brand-red flex items-center gap-1">
            <i class="fa-solid fa-clock-rotate-left"></i> Historique
        </button>
        <button onclick="showTab('favorites')" class="hover:text-brand-red flex items-center gap-1">
            <i class="fa-solid fa-heart"></i> Favoris
        </button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 px-4 lg:px-8 py-6 max-w-7xl mx-auto w-full">
        
        <!-- SECTION ACCUEIL -->
        <section id="homeView">
            <h2 class="text-xl md:text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-fire text-brand-red"></i> Tendances actuelles
            </h2>
            <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Les films/séries TMDB s'afficheront ici -->
            </div>
        </section>

        <!-- SECTION HISTORIQUE -->
        <section id="historyView" class="hidden">
            <h2 class="text-xl md:text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-brand-red"></i> Titres récemment consultés
            </h2>
            <div id="historyGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- L'historique s'affichera ici -->
            </div>
        </section>

        <!-- SECTION FAVORIS -->
        <section id="favoritesView" class="hidden">
            <h2 class="text-xl md:text-2xl font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-heart text-brand-red"></i> Ma Liste
            </h2>
            <div id="favoritesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Les favoris s'afficheront ici -->
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/10 py-6 text-center text-xs text-brand-muted mt-auto">
        <p>&copy; 2026 Novyx Streaming Platform. Tous droits réservés.</p>
    </footer>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        const TMDB_API_KEY = "3fd2be6f0c70a2a598f084dd27548780"; // Clé d'API TMDB standard
        const STREAMZO_URL = "https://streamzo.fr"; // Redirection finale unique et propre

        let currentTab = 'home';

        // Initialisation de la page
        document.addEventListener('DOMContentLoaded', () => {
            fetchTrending();
        });

        // Navigation entre onglets
        function showTab(tabName) {
            currentTab = tabName;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
            document.getElementById('favoritesView').classList.add('hidden');

            if (tabName === 'home') {
                document.getElementById('homeView').classList.remove('hidden');
            } else if (tabName === 'history') {
                document.getElementById('historyView').classList.remove('hidden');
                renderHistory();
            } else if (tabName === 'favorites') {
                document.getElementById('favoritesView').classList.remove('hidden');
                renderFavorites();
            }
        }

        // Récupérer les tendances TMDB
        async function fetchTrending() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_API_KEY}&language=fr-FR`);
                const data = await response.json();
                renderMediaGrid(data.results, 'mediaGrid');
            } catch (error) {
                console.error("Erreur TMDB:", error);
            }
        }

        // Recherche TMDB
        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                fetchTrending();
                return;
            }
            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=fr-FR&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                renderMediaGrid(data.results, 'mediaGrid');
            } catch (error) {
                console.error("Erreur Recherche:", error);
            }
        }

        // Affichage des cartes de films/séries
        function renderMediaGrid(items, elementId) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-brand-muted py-8">Aucun résultat trouvé.</p>`;
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name || 'Titre inconnu';
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=Pas+d%27image';
                const isFav = isFavorite(item.id);

                const card = document.createElement('div');
                card.className = "bg-brand-card rounded-lg overflow-hidden group hover:scale-105 transition duration-300 relative flex flex-col justify-between shadow-lg";
                
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-[2/3]">
                        <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:opacity-80 transition duration-300">
                        <button onclick="toggleFavorite(event, ${JSON.stringify(item).replace(/"/g, '&quot;')})" 
                            class="absolute top-2 right-2 bg-black/60 p-2 rounded-full hover:bg-brand-red transition">
                            <i class="${isFav ? 'fa-solid text-brand-red' : 'fa-regular'} fa-heart text-sm"></i>
                        </button>
                    </div>
                    <div class="p-3 flex flex-col gap-2 flex-1 justify-between">
                        <h3 class="font-bold text-sm line-clamp-1">${title}</h3>
                        <button onclick="triggerWatch(${JSON.stringify(item).replace(/"/g, '&quot;')})" 
                            class="w-full bg-brand-red hover:bg-red-700 text-white py-2 rounded text-xs font-bold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> Regarder
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // REDIRECTION PROPRE VERS STREAMZO (CORRECTION DU BUG DE LA PAGE NOIRE)
        function triggerWatch(media) {
            // 1. Ajouter le contenu à l'historique local
            addToHistory(media);

            // 2. Rediriger directement vers Streamzo
            // (La pub Popunder s'ouvre toute seule au premier clic grâce au script dans le <head>)
            window.location.href = STREAMZO_URL;
        }

        // Gestion du stockage local (Historique)
        function addToHistory(media) {
            let history = JSON.parse(localStorage.getItem('novyx_history')) || [];
            history = history.filter(i => i.id !== media.id); // Éviter les doublons
            history.unshift(media); // Ajouter au début
            if (history.length > 20) history.pop(); // Limite à 20 éléments
            localStorage.setItem('novyx_history', JSON.stringify(history));
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('novyx_history')) || [];
            renderMediaGrid(history, 'historyGrid');
        }

        // Gestion du stockage local (Favoris)
        function isFavorite(id) {
            const favorites = JSON.parse(localStorage.getItem('novyx_favorites')) || [];
            return favorites.some(i => i.id === id);
        }

        function toggleFavorite(event, media) {
            event.stopPropagation();
            let favorites = JSON.parse(localStorage.getItem('novyx_favorites')) || [];
            if (isFavorite(media.id)) {
                favorites = favorites.filter(i => i.id !== media.id);
            } else {
                favorites.push(media);
            }
            localStorage.setItem('novyx_favorites', JSON.stringify(favorites));

            // Rafraîchir la vue actuelle
            if (currentTab === 'favorites') {
                renderFavorites();
            } else if (currentTab === 'history') {
                renderHistory();
            } else {
                handleSearch();
            }
        }

        function renderFavorites() {
            const favorites = JSON.parse(localStorage.getItem('novyx_favorites')) || [];
            renderMediaGrid(favorites, 'favoritesGrid');
        }
    </script>
</body>
</html>
